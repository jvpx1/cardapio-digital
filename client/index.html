<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navegação -->
    <nav class="navegacao">
        <button data-view="cadastro" class="btn-nav">Cadastrar Novo</button>
        <button data-view="cardapio" class="btn-nav">Ver Cardápio</button>
    </nav>

    <main class="container">
        <!-- View: Cadastro -->
        <section id="view-cadastro" hidden>
            <h2>Cadastrar Novo Prato</h2>
            <form id="form-cardapio">
                <div class="form-group">
                    <label for="nome">Nome do Prato / Item</label>
                    <input type="text" id="nome" required placeholder="Ex: Filé a Parmegiana">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Entrada">Entrada</option>
                        <option value="Prato Principal">Prato Principal</option>
                        <option value="Sobremesa">Sobremesa</option>
                        <option value="Bebida">Bebida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" min="0" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição / Ingredientes</label>
                    <textarea id="descricao" placeholder="Acompanha arroz, fritas e molho especial..."></textarea>
                </div>

                <button type="submit" id="btn-submit">Salvar</button>
                <button type="button" id="btn-cancelar" hidden>Cancelar</button>
            </form>
        </section>

        <!-- View: Cardápio -->
        <section id="view-cardapio">
            <h2>Cardápio do Restaurante</h2>
            <ul id="lista-cardapio"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
